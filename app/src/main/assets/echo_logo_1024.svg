<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad1024" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- Glowing Outer Aura -->
    <radialGradient id="auraGrad1024" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#7C4DFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Sonic Ring Gradient -->
    <linearGradient id="ringGrad1_1024" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Inner Sonic Ring Gradient -->
    <linearGradient id="ringGrad2_1024" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Orb Core Gradient -->
    <radialGradient id="orbGrad1024" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#67E8F9"/>
      <stop offset="55%" stop-color="#06B6D4"/>
      <stop offset="80%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow1024" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas with Play Store standard squircle radius -->
  <rect width="1024" height="1024" rx="230" fill="url(#bgGrad1024)"/>
  <rect width="1024" height="1024" rx="230" fill="none" stroke="url(#ringGrad1_1024)" stroke-width="4" opacity="0.3"/>

  <!-- Ambient Glow -->
  <circle cx="512" cy="512" r="440" fill="url(#auraGrad1024)"/>

  <!-- Sonic Wave Ring 1 (Outer Orbit) -->
  <circle cx="512" cy="512" r="336" fill="none" stroke="url(#ringGrad1_1024)" stroke-width="7" opacity="0.4" stroke-dasharray="28 16"/>

  <!-- Sonic Wave Ring 2 (Mid Orbit) -->
  <circle cx="512" cy="512" r="272" fill="none" stroke="url(#ringGrad2_1024)" stroke-width="10" opacity="0.85" filter="url(#glow1024)"/>

  <!-- Sonic Wave Ring 3 (Inner Halo) -->
  <circle cx="512" cy="512" r="216" fill="none" stroke="#00F0FF" stroke-width="5" opacity="0.6"/>

  <!-- Core Glowing AI Voice Orb -->
  <circle cx="512" cy="512" r="176" fill="url(#orbGrad1024)" filter="url(#glow1024)"/>

  <!-- Dynamic Acoustic Waveforms -->
  <path d="M 376 512 C 420 432, 460 592, 512 512 C 564 432, 604 592, 648 512" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.95"/>
  <path d="M 400 512 C 436 564, 476 460, 512 512 C 548 564, 588 460, 624 512" fill="none" stroke="#A5F3FC" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <path d="M 440 512 C 464 484, 488 540, 512 512 C 536 484, 560 540, 584 512" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
</svg>
