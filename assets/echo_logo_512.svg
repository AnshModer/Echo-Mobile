<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- Glowing Outer Aura -->
    <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#7C4DFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Sonic Ring Gradient -->
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Inner Sonic Ring Gradient -->
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Orb Core Gradient -->
    <radialGradient id="orbGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#67E8F9"/>
      <stop offset="55%" stop-color="#06B6D4"/>
      <stop offset="80%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="115" fill="none" stroke="url(#ringGrad1)" stroke-width="2" opacity="0.3"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#auraGrad)"/>

  <!-- Sonic Wave Ring 1 (Outer) -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ringGrad1)" stroke-width="3.5" opacity="0.4" stroke-dasharray="14 8"/>

  <!-- Sonic Wave Ring 2 (Mid) -->
  <circle cx="256" cy="256" r="136" fill="none" stroke="url(#ringGrad2)" stroke-width="5" opacity="0.85" filter="url(#glow)"/>

  <!-- Sonic Wave Ring 3 (Inner Halo) -->
  <circle cx="256" cy="256" r="108" fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.6"/>

  <!-- Core Glowing AI Voice Orb -->
  <circle cx="256" cy="256" r="88" fill="url(#orbGrad)" filter="url(#glow)"/>

  <!-- Siri/Gemini dynamic acoustic waveforms -->
  <path d="M 188 256 C 210 216, 230 296, 256 256 C 282 216, 302 296, 324 256" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
  <path d="M 200 256 C 218 282, 238 230, 256 256 C 274 282, 294 230, 312 256" fill="none" stroke="#A5F3FC" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 220 256 C 232 242, 244 270, 256 256 C 268 242, 280 270, 292 256" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
</svg>
